<style>
/* Tokens. Subject cue: Mains answers are written in blue ink and marked in red.
   Blue = the one interactive accent. Red = reserved for "critical / needs action". */
:root{
  --l0:#f4f5f7; --l1:#ffffff; --l2:#ffffff; --l3:#ffffff;
  --ink:#16191f; --ink-2:#4f5663; --ink-3:#687080;
  --border:rgba(22,25,31,.09); --border-2:rgba(22,25,31,.16);
  --accent:#2350a0; --accent-hover:#1c418a; --accent-soft:rgba(35,80,160,.08); --on-accent:#ffffff;
  --crit:#b93226; --crit-soft:rgba(185,50,38,.08);
  --warn-dot:#d69e00;
  --s-prob:#eb6834; --s-req:#2a78d6; --s-praise:#1baf7a; --s-line:#2a78d6;
  --grid:#e6e8ec; --axis:#c3c7cf;
  --shadow-1:0 1px 2px rgba(0,0,0,.04); --shadow-3:0 8px 24px rgba(0,0,0,.07);
  --hl:rgba(35,80,160,.12);
  --font:"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-meta:.75rem; --t-sec:.875rem; --t-body:1rem; --t-h3:1.1875rem; --t-h2:1.4375rem; --t-h1:1.75rem;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px; --sp-12:48px;
  --r-1:6px; --r-2:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --l0:#0f1115; --l1:#171a20; --l2:#1d2128; --l3:#1d2128;
    --ink:#eceef2; --ink-2:#b4bac5; --ink-3:#8f96a2;
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
    --accent:#86a9ec; --accent-hover:#a3bef2; --accent-soft:rgba(134,169,236,.12); --on-accent:#0d1830;
    --crit:#ef7466; --crit-soft:rgba(239,116,102,.12); --warn-dot:#e0b12e;
    --s-prob:#d95926; --s-req:#3987e5; --s-praise:#199e70; --s-line:#3987e5;
    --grid:#262a32; --axis:#3a404b; --shadow-1:inset 0 1px 0 rgba(255,255,255,.05); --shadow-3:0 8px 24px rgba(0,0,0,.35); --hl:rgba(134,169,236,.18);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --l0:#0f1115; --l1:#171a20; --l2:#1d2128; --l3:#1d2128;
  --ink:#eceef2; --ink-2:#b4bac5; --ink-3:#8f96a2;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
  --accent:#86a9ec; --accent-hover:#a3bef2; --accent-soft:rgba(134,169,236,.12); --on-accent:#0d1830;
  --crit:#ef7466; --crit-soft:rgba(239,116,102,.12); --warn-dot:#e0b12e;
  --s-prob:#d95926; --s-req:#3987e5; --s-praise:#199e70; --s-line:#3987e5;
  --grid:#262a32; --axis:#3a404b; --shadow-1:inset 0 1px 0 rgba(255,255,255,.05); --shadow-3:0 8px 24px rgba(0,0,0,.35); --hl:rgba(134,169,236,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--l0);color:var(--ink);font:400 var(--t-body)/1.55 var(--font)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-size:var(--t-h1);letter-spacing:-.01em}
h2{font-size:var(--t-h3)}
h3{font-size:var(--t-body)}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sec{font-size:var(--t-sec);color:var(--ink-2)}
.meta{font-size:var(--t-meta);color:var(--ink-3);line-height:1.4}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell (full width; only the page is capped) */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--l1);border-right:1px solid var(--border);padding:var(--sp-6) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-6)}
.brand{padding:0 var(--sp-3)}
.brand b{display:block;font-size:var(--t-h3);font-weight:600;letter-spacing:-.01em}
.brand span{font-size:var(--t-meta);color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:var(--sp-1)}
.nav a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 var(--sp-3);border-radius:var(--r-1);color:var(--ink-2);font-size:var(--t-sec);font-weight:500}
.nav a:hover{background:var(--accent-soft);color:var(--ink);text-decoration:none}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{font-weight:400;color:var(--ink-3)}
.nav .count.crit{color:var(--crit);font-weight:500}
.side-foot{margin-top:auto;padding:0 var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.topbar{display:none}
.main{min-width:0}
.page{width:100%;max-width:1280px;margin-inline:auto;padding:var(--sp-8) var(--sp-8) var(--sp-12);display:flex;flex-direction:column;gap:var(--sp-6)}

/* Page header */
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:var(--sp-4)}
.phead .t{display:flex;flex-direction:column;gap:var(--sp-2);max-width:70ch}
.phead .t p{color:var(--ink-2)}
.sample{font-size:var(--t-meta);color:var(--ink-3)}

/* Surfaces */
.card{background:var(--l1);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-1)}
.pad{padding:var(--sp-6)}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-6)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:40px;padding:0 var(--sp-4);border-radius:var(--r-1);border:1px solid var(--border-2);background:var(--l1);font-size:var(--t-sec);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:44px;height:44px;padding:0;border-radius:var(--r-1);border:1px solid transparent;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--accent-soft)}

/* Segmented control */
.seg{display:inline-flex;padding:var(--sp-1);gap:var(--sp-1);background:var(--l0);border:1px solid var(--border);border-radius:var(--r-2);flex-wrap:wrap}
.seg button{min-height:36px;padding:0 var(--sp-4);border:0;border-radius:var(--r-1);background:none;cursor:pointer;font-size:var(--t-sec);font-weight:500;color:var(--ink-2)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--l1);color:var(--ink);box-shadow:0 0 0 1px var(--border-2)}
.seg .n{color:var(--ink-3);font-weight:400;margin-left:var(--sp-1)}

/* Update line */
.update{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3) var(--sp-6);padding:var(--sp-4) var(--sp-6)}
.update b{font-weight:600}
.update .facts{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-6);color:var(--ink-2);font-size:var(--t-sec)}
.update .facts strong{color:var(--ink);font-weight:600}
.update .go{margin-left:auto}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-4)}
.kpi{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-6);color:var(--ink);text-decoration:none!important;transition:border-color .15s}
.kpi:hover{border-color:var(--border-2)}
.kpi .lbl{font-size:var(--t-sec);color:var(--ink-2);font-weight:500}
.kpi .big{display:flex;align-items:baseline;gap:var(--sp-2)}
.kpi .big b{font-size:2.25rem;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.kpi .big span{font-size:var(--t-sec);color:var(--ink-2)}
.kpi .spark{height:36px;width:100%}
.kpi .top{font-size:var(--t-sec);color:var(--ink-2)}
.kpi .top b{color:var(--ink);font-weight:500}
.kpi .more{font-size:var(--t-sec);color:var(--accent);font-weight:500;margin-top:auto;padding-top:var(--sp-2)}
.kpi.crit{border-color:color-mix(in srgb,var(--crit) 35%,var(--border))}
.kpi.crit .big b{color:var(--crit)}
.kpi .new{color:var(--ink)}

/* Bars (HTML) */
.bars{display:flex;flex-direction:column;gap:var(--sp-1)}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 40px;gap:var(--sp-3);align-items:center;min-height:40px;padding:0 var(--sp-2);border-radius:var(--r-1);color:var(--ink);text-decoration:none!important;font-size:var(--t-sec)}
.bar:hover{background:var(--accent-soft)}
.bar .track{height:12px;background:var(--l0);border-radius:0 4px 4px 0}
.bar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--s-prob)}
.bar .v{text-align:right;color:var(--ink-2)}

/* Quotes */
.quote{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-3) 0;border-top:1px solid var(--border)}
.quote:first-child{border-top:0;padding-top:0}
.quote p{font-size:var(--t-sec)}
.quote mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 2px}
.quote .by{font-size:var(--t-meta);color:var(--ink-3)}
.quote .by .crit{color:var(--crit);font-weight:500}

/* List toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center}
.search{display:flex;align-items:center;gap:var(--sp-2);flex:1;min-width:220px;max-width:420px;min-height:40px;padding:0 var(--sp-3);border:1px solid var(--border-2);border-radius:var(--r-1);background:var(--l1)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .lab{font-size:var(--t-sec);color:var(--ink-2);font-weight:500}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:var(--t-sec);padding:var(--sp-2) 0}
.search kbd{font:inherit;font-size:var(--t-meta);color:var(--ink-3);border:1px solid var(--border-2);border-radius:4px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:32px;padding:0 var(--sp-1) 0 var(--sp-3);border-radius:var(--r-1);background:var(--accent-soft);font-size:var(--t-sec)}
.chip button{width:28px;height:28px;border:0;background:none;cursor:pointer;color:var(--ink-2);border-radius:4px}
.chip button:hover{background:var(--accent-soft)}
.linkbtn{border:0;background:none;padding:var(--sp-2) var(--sp-1);color:var(--accent);cursor:pointer;font-size:var(--t-sec);font-weight:500}
.filters-wrap{position:relative}
.popover{position:absolute;top:calc(100% + var(--sp-2));left:0;z-index:100;width:300px;max-width:calc(100vw - 32px);background:var(--l2);border:1px solid var(--border-2);border-radius:var(--r-2);box-shadow:var(--shadow-3);padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4)}
.field{display:flex;flex-direction:column;gap:var(--sp-1)}
.field label{font-size:var(--t-sec);font-weight:500}
.field select{min-height:40px;padding:0 var(--sp-3);border:1px solid var(--border-2);border-radius:var(--r-1);background:var(--l1)}
.pop-actions{display:flex;justify-content:flex-end;gap:var(--sp-2)}

/* Table (L1 frame + hairlines) */
.tframe{background:var(--l1);border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;box-shadow:var(--shadow-1)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--t-sec)}
thead th{position:sticky;top:0;background:var(--l1);text-align:left;font-weight:500;color:var(--ink-2);padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);white-space:nowrap}
th.r,td.r{text-align:right}
th[aria-sort]{color:var(--ink)}
tbody td{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--accent-soft)}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);color:var(--accent);font-weight:500;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:var(--t-sec)}
.rowlink svg{flex-shrink:0;color:var(--ink-3)}
.sev{display:inline-flex;align-items:center;gap:var(--sp-2);white-space:nowrap}
.sev i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sev.blocking i{background:var(--crit)}
.sev.annoying i{background:var(--warn-dot)}
.chg{white-space:nowrap}
.chg small{display:block;font-size:var(--t-meta);color:var(--ink-3)}
.newtag{color:var(--accent);font-weight:500}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);font-size:var(--t-sec);color:var(--ink-2)}
.pager .btns{display:flex;gap:var(--sp-2)}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:56ch}
.empty{padding:var(--sp-12) var(--sp-6);text-align:center;display:flex;flex-direction:column;gap:var(--sp-2);align-items:center}
.note{font-size:var(--t-sec);color:var(--ink-2);max-width:70ch}
.note.box{background:var(--l1);border:1px solid var(--border);border-radius:var(--r-2);padding:var(--sp-4)}
.switch{display:inline-flex;align-items:center;gap:var(--sp-3);cursor:pointer;min-height:44px;font-size:var(--t-sec);font-weight:500}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--border-2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--l1);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-family:var(--font);font-size:12px}
.chart .grid{stroke:var(--grid)}
.chart .axis{stroke:var(--axis)}
.chart .hit{fill:transparent;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);font-size:var(--t-sec);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:var(--sp-2);vertical-align:0}
.stack{display:flex;height:14px;gap:2px;border-radius:3px;overflow:hidden;min-width:80px}
.stack span{display:block;height:100%}

/* Slide-over (L3) */
.scrim{position:fixed;inset:0;background:rgba(15,17,21,.32);z-index:200}
.over{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:201;background:var(--l3);border-left:1px solid var(--border-2);box-shadow:var(--shadow-3);display:flex;flex-direction:column}
.over-h{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-6) var(--sp-6) var(--sp-4);border-bottom:1px solid var(--border)}
.over-h .t{display:flex;flex-direction:column;gap:var(--sp-1)}
.over-b{flex:1;overflow:auto;padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-6)}
.over-f{padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center}
.facts4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4)}
.facts4 div{display:flex;flex-direction:column;gap:2px}
.facts4 dt{font-size:var(--t-meta);color:var(--ink-3)}
.facts4 dd{margin:0;font-weight:500}
.callout{border-left:3px solid var(--accent);padding:var(--sp-2) var(--sp-4);font-size:var(--t-sec);color:var(--ink-2)}
ul.plain{margin:0;padding-left:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-2);font-size:var(--t-sec)}

#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--l0);font-size:var(--t-meta);line-height:1.4;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-1);max-width:240px}
#toast{position:fixed;left:50%;bottom:var(--sp-6);transform:translateX(-50%);z-index:400;background:var(--ink);color:var(--l0);font-size:var(--t-sec);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-1);max-width:calc(100% - 32px)}

@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:767.98px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:210;transform:translateX(-102%);transition:transform .2s;height:100%}
  .app.nav-open .side{transform:none;box-shadow:var(--shadow-3)}
  .topbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);background:var(--l1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .topbar b{font-weight:600}
  .page{padding:var(--sp-6) var(--sp-4) var(--sp-12)}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .update .go{margin-left:0}
  .search{max-width:none}
  .bar{grid-template-columns:minmax(100px,130px) minmax(0,1fr) 32px}
  .tscroll table{min-width:640px}
  .tscroll th:first-child,.tscroll td:first-child{position:sticky;left:0;z-index:1;background:var(--l1);min-width:180px;box-shadow:1px 0 0 var(--border)}
  .chartwrap .chart{min-width:760px} /* keeps axis labels at 12px; chart scrolls inside its own region */
}
.chartwrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);

function mark(t,h){ const e=esc(t); if(!h) return e; const eh=esc(h); const i=e.indexOf(eh); return i<0?e:e.slice(0,i)+"<mark>"+eh+"</mark>"+e.slice(i+eh.length); }

function quoteHTML(q){ return `<div class="quote"><p>“${mark(q.t,q.h)}”</p><span class="by">${esc(q.who)}, ${q.stars} star${q.stars===1?"":"s"}, ${esc(q.date)}, ${esc(q.store)}${q.flag?`. <span class="crit">${q.flag}</span>`:""}</span></div>`; }
function spark(vals,color){ const W=240,H=36,max=Math.max(...vals),x=i=>i/(vals.length-1)*(W-6)+3,y=v=>H-4-(v/max)*(H-10); const d=vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join(""); const last=vals.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${x(last)},${H}L${x(0)},${H}Z" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${x(last)}" cy="${y(vals[last])}" r="3" fill="${color}"/></svg>`; }

/* ---------------- Charts ---------------- */
function trendChart(){
  const M=MONTHS,W=760,H=230,L=40,R=12,T=16,B=32,iw=W-L-R,ih=H-T-B,bw=iw/M.length;
  let g="",body="",lbl="";
  M.forEach((m,i)=>{ if(i%3===0||i===M.length-1) lbl+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${m[0]}</text>`; });
  if(S.chart==="rating"){
    const lo=3.8,hi=5,y=v=>T+ih-(v-lo)/(hi-lo)*ih;
    [4,4.5,5].forEach(v=>g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`);
    const pts=M.map((m,i)=>[L+i*bw+bw/2,y(m[2])]);
    body+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("")}" fill="none" stroke="var(--s-line)" stroke-width="2" stroke-linejoin="round"/>`;
    M.forEach((m,i)=>{ body+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="var(--s-line)" stroke="var(--l1)" stroke-width="2"/><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" data-tip="${m[0]}: ${m[2].toFixed(2)} average from ${m[1]} reviews"/>`; });
    const low=M.reduce((a,m,i)=>m[2]<M[a][2]?i:a,0);
    body+=`<text x="${pts[low][0]}" y="${pts[low][1]+20}" text-anchor="middle" style="fill:var(--ink-2)">Lowest: ${M[low][2].toFixed(2)}</text>`;
  } else {
    const max=60,y=v=>T+ih-v/max*ih;
    [0,20,40,60].forEach(v=>g+=`<line class="${v?"grid":"axis"}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
    M.forEach((m,i)=>{ const x=L+i*bw+bw*.2,w=bw*.6,h=y(0)-y(m[1]); body+=`<path d="M${x},${y(0)}V${y(m[1])+4}Q${x},${y(m[1])} ${x+4},${y(m[1])}H${x+w-4}Q${x+w},${y(m[1])} ${x+w},${y(m[1])+4}V${y(0)}Z" fill="var(--s-line)"/><rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" data-tip="${m[0]}: ${m[1]} reviews"/>`; });
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${S.chart==="rating"?"Average rating per month":"Reviews per month"}">${g}${body}${lbl}</svg>`;
}

  return `<header class="phead"><div class="t"><h1>Feedback</h1><p>${desc}</p><span class="sample">Sample data for layout review.</span></div></header>
  <div class="seg" role="tablist" aria-label="Feedback type">${[["fix","Fix",FIX.length],["build","Build",BUILD.length],["protect","Protect",PROTECT.length]].map(([id,l,n])=>`<button role="tab" aria-selected="${S.tab===id}" data-tab="${id}">${l}<span class="n">${n}</span></button>`).join("")}</div>
  <div class="toolbar"><label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="lab">Search</span><input id="q" type="search" value="${esc(S.q)}" aria-label="Search ${S.tab==="fix"?"problems":S.tab==="build"?"requests":"praise"}"><kbd>/</kbd></label>
    <div class="filters-wrap"><button class="btn" id="filtersBtn" aria-expanded="${S.pop}" aria-controls="filtersPop">Filters${chips.length?` (${chips.length})`:""}</button>
    <div class="popover" id="filtersPop" role="dialog" aria-label="Filters" ${S.pop?"":"hidden"}>
      <div class="field"><label for="fArea">Product area</label><select id="fArea"><option value="">Any area</option>${areas.map(a=>`<option ${S.f.area===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
      ${S.tab==="fix"?`<div class="field"><label for="fSev">Severity</label><select id="fSev"><option value="">Any severity</option><option ${S.f.sev==="Blocking"?"selected":""}>Blocking</option><option ${S.f.sev==="Annoying"?"selected":""}>Annoying</option></select></div>`:""}
      ${S.tab!=="protect"?`<div class="field"><label for="fSeen">Last seen</label><select id="fSeen"><option value="">Any time</option><option value="90" ${S.f.seen==="90"?"selected":""}>In the last 90 days</option><option value="30" ${S.f.seen==="30"?"selected":""}>In the last 30 days</option></select></div>`:""}
      <div class="pop-actions"><button class="btn" data-clear="1">Clear filters</button><button class="btn primary" id="applyF">Apply filters</button></div></div></div></div>
  ${chips.length?`<div class="chips">${chips.map(([k,v])=>`<span class="chip">${esc(k==="area"?"Area: "+v:k==="sev"?"Severity: "+v:v)}<button data-unchip="${k}" aria-label="Remove filter">×</button></span>`).join("")}<button class="linkbtn" data-clear="1">Clear all</button></div>`:""}
  <div class="tframe"><div class="tscroll"><table><thead><tr>${cols.map((c,i)=>`<th scope="col" class="${i===2?"r":""}" ${i===2?'aria-sort="descending"':""}>${c}${i===2?" ↓":""}</th>`).join("")}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}"><div class="empty"><b>No matches</b><span class="sec">Nothing matches these filters.</span><button class="btn" data-clear="1">Clear filters</button></div></td></tr>`}</tbody></table></div>

}

function pBreakdowns(){

  <div class="tframe"><div class="tscroll"><table><thead><tr><th scope="col" aria-sort="descending">Date ↓</th><th scope="col">Review</th><th scope="col">Rating</th><th scope="col">Store</th><th scope="col">Reply</th></tr></thead><tbody>${rows.map(r=>`<tr class="row" data-review="${r.id}" tabindex="0"><td class="num" style="white-space:nowrap">${esc(r.date)}</td><td><button class="rowlink" data-review="${r.id}"><span class="clip">${esc(r.text)}</span>${chevron}</button><div class="meta">${esc(r.who)}</div></td><td class="num">${r.stars} of 5</td><td>${esc(r.store)}</td><td>${r.reply==="Unknown"?`<span class="sec">Unknown</span>`:esc(r.reply)}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty"><b>No reviews in this view</b><button class="btn" data-rview="all">Show all reviews</button></div></td></tr>`}</tbody></table></div><div class="pager"><span>Showing ${rows.length?1:0} to ${rows.length} of ${rows.length}</span><div class="btns"><button class="btn" disabled>Previous</button><button class="btn" disabled>Next</button></div></div></div>`;
}

function pAbout(){
  return `<header class="phead"><div class="t"><h1>How this works</h1><p>Where the data comes from, how it's sorted, and what it can't tell you.</p></div></header>
  <section class="card pad" style="max-width:75ch;display:flex;flex-direction:column;gap:var(--sp-4)">

   <p class="meta">Independent portfolio project. Not affiliated with SuperKalam or Snapstack Technologies.</p></section>`;
}

/* ---------------- Slide-over ---------------- */
function openOver(html,trigger){ S.lastFocus=trigger||document.activeElement; const o=$("#over"); o.innerHTML=html; o.hidden=false; $("#scrim").hidden=false; const c=o.querySelector("[data-close]"); c&&c.focus(); }
function closeOver(){ if($("#over").hidden) return; $("#over").hidden=true; $("#scrim").hidden=true; S.lastFocus&&S.lastFocus.focus&&S.lastFocus.focus(); }
const closeBtn=`<button class="icon-btn" data-close aria-label="Close panel"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m4.5 4.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>`;
function itemPanel(id){
  const i=ALL[id], isFix=id[0]==="f", isBuild=id[0]==="b";
  const kind=isFix?"Problem":isBuild?"Request":"Praise";
  const meta=isFix?`${i.sev} problem in ${i.area}`:isBuild?`${i.pri} request for ${i.area}`:`Loved for ${i.why.toLowerCase()}, in ${i.area}`;
  return `<div class="over-h"><div class="t"><span class="meta">${kind}</span><h2 id="overTitle">${esc(i.name)}</h2><span class="sec">${esc(meta)}</span></div>${closeBtn}</div>
  <div class="over-b">
    <dl class="facts4"><div><dt>Reviews</dt><dd class="num">${i.n}</dd></div><div><dt>Last 90 days</dt><dd class="num">${i.cur} <span class="sec">${i.prev===0&&i.cur>0?"(new)":`(was ${i.prev})`}</span></dd></div>${i.first?`<div><dt>First seen</dt><dd>${fd(i.first)}</dd></div><div><dt>Last seen</dt><dd>${fd(i.last)}</dd></div>`:""}${isBuild?`<div><dt>From unhappy users</dt><dd>${i.unhappy}%</dd></div>`:""}</dl>
    ${i.alsoReq?`<p class="callout">Users also ask for this as a feature. It is counted once, here under Fix.</p>`:""}
    <section><h3 style="margin-bottom:var(--sp-3)">What users say</h3>${i.q.length?i.q.map(quoteHTML).join(""):`<p class="sec">Example quotes appear here in the full build.</p>`}</section>
    ${i.phr?`<section><h3 style="margin-bottom:var(--sp-2)">Also phrased as</h3><ul class="plain">${i.phr.map(p=>`<li>“${esc(p)}”</li>`).join("")}</ul></section>`:""}
  </div>
  <div class="over-f"><button class="btn primary" data-goreviews="1">View ${plural(i.n,"review")}</button><button class="btn" disabled aria-describedby="soon">Save as ticket</button><span class="meta" id="soon">Coming soon</span></div>`;
}
function reviewPanel(r,crit){
  return `<div class="over-h"><div class="t"><span class="meta">${crit?`<span style="color:var(--crit);font-weight:500">Critical: ${esc(r.cat)}</span>`:"Review"}</span><h2 id="overTitle">${esc(r.who)}</h2><span class="sec">${r.stars} of 5 stars, ${esc(r.date)}, ${esc(r.store)}</span></div>${closeBtn}</div>
  <div class="over-b"><p>${mark(r.text,r.h)}</p>
  <section><h3 style="margin-bottom:var(--sp-2)">Developer reply</h3><p class="sec">${r.replyText?esc(r.replyText):r.reply==="Unknown"?"Unknown. Apple doesn't publish developer replies.":r.reply==="No reply"?"No reply yet.":"The developer replied. Full text appears in the full build."}</p></section></div>
  <div class="over-f"><span class="meta">Sorted by hand (first 475 reviews)</span></div>`;
}
function updatePanel(){ return `<div class="over-h"><div class="t"><span class="meta">Update for 14 to 27 Sep 2026</span><h2 id="overTitle">What changed</h2><span class="sec">Compared with 31 Aug to 13 Sep</span></div>${closeBtn}</div>
  <div class="over-b"><ul class="plain"><li>A quiet fortnight: 7 new reviews, down from 28.</li><li>Average rating 4.43, down from 4.64, pulled down by one 1-star review.</li><li>1 critical review: support couldn't resolve a user's doubt. The developer replied within 5 minutes.</li><li>Version 1.6.7 first appeared on 15 Sep: 5 reviews so far, average 4.2.</li><li>Nothing new was reported for the first time.</li></ul>
  <div class="field"><label for="pastU">Past updates</label><select id="pastU"><option>14 to 27 Sep 2026</option><option>31 Aug to 13 Sep 2026</option></select></div></div>
  <div class="over-f"><a class="btn primary" href="#feedback" data-close>Open Feedback</a></div>`; }
function emailPanel(){ const c=CRIT[0]; return `<div class="over-h"><div class="t"><span class="meta">Alert email preview</span><h2 id="overTitle">1 critical review without a reply</h2><span class="sec">Sent to recipients set in configuration</span></div>${closeBtn}</div>

/* ---------------- Router & events ---------------- */
function route(){
  let h=(location.hash||"#home").slice(1)||"home";
  if(h.startsWith("feedback")){ const t=h.split("-")[1]; if(t) S.tab=t; if(h!=="feedback"&&t){ history.replaceState(null,"","#feedback"); } h="feedback"; }
  const pages={home:pHome,feedback:pFeedback,breakdowns:pBreakdowns,support:pSupport,reviews:pReviews,about:pAbout};
  $("#view").innerHTML=(pages[h]||pHome)(); renderNav(pages[h]?h:"home"); $("#app").classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded","false"); bind();
}
function rerender(){ const y=scrollY; route(); scrollTo(0,y); }
function bind(){
  const q=$("#q"); if(q) q.addEventListener("input",e=>{ S.q=e.target.value; const p=e.target.selectionStart; rerender(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); });
  const r=$("#range"); if(r) r.addEventListener("change",e=>{ S.range=e.target.value; rerender(); });
  const st=$("#spikeT"); if(st) st.addEventListener("change",e=>{ S.spikes=e.target.checked; try{localStorage.setItem("av2-spikes",S.spikes?"1":"0");}catch(err){} toast(S.spikes?"Spike-day reviews are counted":"Spike-day reviews are left out of all numbers"); });
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-item],[data-crit],[data-review],[data-open],[data-close],[data-chart],[data-group],[data-rview],[data-unchip],[data-clear],[data-goreviews],[data-export],[data-soon],#filtersBtn,#applyF,.bar[data-area]");
  if(!t) return;
  if(t.matches("[data-close]")){ closeOver(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.f={area:"",sev:"",seen:""}; S.pop=false; rerender(); return; }
  if(t.dataset.item){ openOver(itemPanel(t.dataset.item),t); return; }
  if(t.dataset.crit){ openOver(reviewPanel(CRIT.find(c=>c.id===t.dataset.crit),true),t); return; }
  if(t.dataset.review){ openOver(reviewPanel(REVIEWS.find(c=>c.id===t.dataset.review),false),t); return; }
  if(t.dataset.open){ openOver(t.dataset.open==="update"?updatePanel():emailPanel(),t); return; }
  if(t.dataset.chart){ S.chart=t.dataset.chart; rerender(); return; }
  if(t.dataset.group){ S.group=t.dataset.group; rerender(); return; }
  if(t.dataset.rview){ S.rview=t.dataset.rview; rerender(); return; }
  if(t.dataset.unchip){ S.f[t.dataset.unchip]=""; rerender(); return; }
  if(t.dataset.clear){ S.f={area:"",sev:"",seen:""}; S.pop=false; rerender(); return; }
  if(t.dataset.goreviews){ closeOver(); S.rview="all"; S.q=""; location.hash="reviews"; return; }
  if(t.dataset.export){ toast("Export downloads a CSV file in the full build."); return; }
  if(t.dataset.soon){ toast(t.dataset.soon+" arrive in the full build."); return; }
  if(t.id==="filtersBtn"){ S.pop=!S.pop; rerender(); if(S.pop){ const f=$("#fArea"); f&&f.focus(); } return; }
  if(t.id==="applyF"){ S.f.area=$("#fArea")?.value||""; S.f.sev=$("#fSev")?.value||""; S.f.seen=$("#fSeen")?.value||""; S.pop=false; rerender(); return; }
  if(t.matches(".bar[data-area]")){ e.preventDefault(); S.tab="fix"; S.f={area:t.dataset.area,sev:"",seen:""}; location.hash="feedback"; if(location.hash==="#feedback") rerender(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(!$("#over").hidden) closeOver(); else if(S.pop){ S.pop=false; rerender(); $("#filtersBtn")?.focus(); } }
  if(e.key==="/" && !e.target.matches("input,select,textarea")){ const q=$("#q"); if(q){ e.preventDefault(); q.focus(); } }
  if(e.key==="Enter" && e.target.matches("tr.row")){ e.target.querySelector(".rowlink")?.click(); }
  if(e.key==="Tab" && !$("#over").hidden){ const f=[...$("#over").querySelectorAll("button:not([disabled]),a[href],select,input")]; if(!f.length) return; const a=f[0],z=f[f.length-1]; if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey&&document.activeElement===z){ e.preventDefault(); a.focus(); } }
});
$("#scrim").addEventListener("click",closeOver);
$("#menuBtn").addEventListener("click",()=>{ const o=$("#app").classList.toggle("nav-open"); $("#menuBtn").setAttribute("aria-expanded",String(o)); });
const tip=$("#tip");
document.addEventListener("mousemove",e=>{ const t=e.target.closest("[data-tip]"); if(!t){ tip.hidden=true; return; } tip.textContent=t.dataset.tip; tip.hidden=false; let x=e.clientX+14,y=e.clientY+14; if(x+tip.offsetWidth>innerWidth-8) x=e.clientX-tip.offsetWidth-14; if(y+tip.offsetHeight>innerHeight-8) y=e.clientY-tip.offsetHeight-14; tip.style.left=x+"px"; tip.style.top=y+"px"; });
window.addEventListener("hashchange",()=>{ closeOver(); route(); scrollTo(0,0); });
route();
</script>
